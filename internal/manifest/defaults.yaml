render:
  defaults:
    tools: ["resvg", "rsvg-convert", "inkscape", "vips", "magick", "oxipng", "gifsicle", "jpegoptim", "cwebp"]
  tools:
    resvg:
      tool: "resvg"
      accepts: [".svg"]
      produces: [".png"]
      scale_modes: ["fit"]
      size_template: "--width {width} --height {height}"
      command: "resvg {size} {input} {output}"
    rsvg-convert:
      tool: "rsvg-convert"
      accepts: [".svg"]
      produces: [".png"]
      scale_modes: ["fit"]
      command: "rsvg-convert -w {width} -h {height} -o {output} {input}"
    inkscape:
      tool: "inkscape"
      accepts: [".svg", ".eps"]
      produces: [".png"]
      scale_modes: ["fit"]
      command: "inkscape {input} --export-filename={output} --export-width={width} --export-height={height}"
    vips:
      tool: "vips"
      accepts: [".png", ".jpg", ".jpeg", ".webp", ".gif"]
      produces: [".png", ".jpg", ".jpeg", ".webp", ".gif"]
      command: "vips copy {input} {output}"
    magick:
      tool: "magick"
      # TODO(bramp): Query ImageMagick capabilities (for example via
      # `magick -list format`) so accepts/produces reflect runtime support
      # instead of this static bitmap list.
      accepts: [".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp", ".tif", ".tiff"]
      produces: [".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp", ".tif", ".tiff"]
      scale_modes: ["fit", "fill", "stretch", "crop"]
      size_template: "-resize {width}x{height} -background {background} -gravity center -extent {width}x{height}"
      size_by_mode:
        fill: "-resize {width}x{height}^ -gravity center -extent {width}x{height}"
        stretch: "-resize {width}x{height}!"
        crop: "-resize {width}x{height}^ -gravity center -extent {width}x{height}"
      command: "magick {input} {size} {output}"
    oxipng:
      kind: "optimize"
      tool: "oxipng"
      accepts: [".png"]
      produces: [".png"]
      command: "oxipng -o 3 --strip safe --out {output} {input}"
    gifsicle:
      kind: "optimize"
      tool: "gifsicle"
      accepts: [".gif"]
      produces: [".gif"]
      command: "gifsicle -O3 {input} -o {output}"
    jpegoptim:
      kind: "optimize"
      tool: "jpegoptim"
      accepts: [".jpg", ".jpeg"]
      produces: [".jpg", ".jpeg"]
      command: "cp {input} {output} && jpegoptim --strip-all {output}"
    cwebp:
      kind: "optimize"
      tool: "cwebp"
      accepts: [".webp"]
      produces: [".webp"]
      command: "cwebp -quiet -q 82 {input} -o {output}"
